<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Start Session — Verilock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <span class="eyebrow">Faculty dashboard</span>
        <h1>Start a Class Session</h1>
        <p>Pick the subject you're taking right now. This creates a new session and starts the live QR code for it.</p>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>Subject</label>
            <select name="subject" required style="width:100%; padding:12px 14px; margin-bottom:20px; background:#F8FAFC; border:1px solid #E3E8EF; border-radius:8px; color:#1E293B; font-size:1rem; font-family:'Inter', sans-serif;">
                <option value="" disabled selected>Choose a subject</option>
                {% for subj in subjects %}
                <option value="{{ subj }}">{{ subj }}</option>
                {% endfor %}
            </select>

            <button type="submit">Start Session</button>
        </form>

        <a class="back-link" href="/admin/logout">Log out</a>
    </div>
</body>
</html>
